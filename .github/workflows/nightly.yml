name: Nightly app corpus
'on':
  schedule:
  - cron: 17 3 * * *
  - cron: 47 6 * * *
  - cron: 23 10 * * *
  workflow_dispatch:
    inputs:
      allow_tcg:
        description: Allow software emulation for explicit manual runs
        type: boolean
        default: false
  # Only pull requests that change the corpus or what it depends on; the same
  # list as CORPUS_DIRS and CORPUS_FILES in tools/ci/plan.py.
  pull_request:
    paths:
    - userland/store/**
    - tests/appcorpus/**
    - tests/reference/**
    - tools/appcorpus.py
    - tools/download_cache.py
    - kernel/apps/store.c
    - kernel/apps/store_catalog.h
    - tools/bundle_firefox.py
    - tools/bundle_mesa.py
    - tools/build_vkd3d_proton.py
    - .github/workflows/nightly.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-app-corpus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Gate (scope and nightly retries)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install host test dependencies
      run: |-
        sudo apt-get update -qq
        sudo apt-get install -y -qq python3-yaml
    - name: Host regressions
      run: python3 -m unittest discover -s tests/tools -v
    - name: Plan corpus scope
      run: python3 tools/ci/plan.py
      id: scope
    - name: Decide whether to execute
      run: python3 tools/ci/nightly_gate.py
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        CORPUS_SCOPE: ${{ steps.scope.outputs.corpus }}
    - name: Select every corpus program
      run: echo "matrix=$(python3 tools/ci/plan.py --matrix)" >> "$GITHUB_OUTPUT"
      id: matrix
  build:
    name: Build
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/build.yml
  app-corpus:
    name: App corpus (${{ matrix.id }})
    needs:
    - gate
    - build
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      CORPUS_APP: ${{ matrix.app }}
    steps:
    - uses: actions/checkout@v4
    - name: Install corpus dependencies
      run: tools/ci/install.sh corpus
    - name: Require working accelerator
      run: tools/ci/enable-kvm.sh required
      env:
        NOVARUN_ALLOW_TCG: ${{ inputs.allow_tcg || false }}
    - uses: actions/download-artifact@v4
      with:
        name: nova-image
        path: build
    - name: Verify tested image
      run: python3 tools/ci/image_manifest.py verify --sha "$GITHUB_SHA"
    - name: Program download cache
      uses: actions/cache@v4
      with:
        path: appcorpus-cache
        key: appcorpus-v3-${{ matrix.id }}-${{ hashFiles('tools/download_cache.py', 'tools/appcorpus.py', 'tests/appcorpus/**')
          }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: appcorpus-v3-${{ matrix.id }}-${{ hashFiles('tools/download_cache.py', 'tools/appcorpus.py',
          'tests/appcorpus/**') }}-
    - name: Does the program need VKD3D-Proton (built by NovaOS)
      id: vkd3d
      run: python3 -c "import sys; sys.path.insert(0, 'tools'); import appcorpus; print('need=' + str(any('VKD3D-Proton'
        in a.runtimes for a in appcorpus.selected_apps(appcorpus.APPS, sys.argv[1]))).lower())" "$CORPUS_APP" >>
        "$GITHUB_OUTPUT"
    - name: Cache VKD3D-Proton
      id: vkd3d-cache
      if: steps.vkd3d.outputs.need == 'true'
      uses: actions/cache@v4
      with:
        path: corpus-local/vkd3d-proton.7z
        key: vkd3d-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_vkd3d_proton.py') }}
    - name: Install the VKD3D-Proton build dependencies
      if: steps.vkd3d.outputs.need == 'true' && steps.vkd3d-cache.outputs.cache-hit != 'true'
      run: tools/ci/install.sh vkd3d
    - name: Build VKD3D-Proton
      if: steps.vkd3d.outputs.need == 'true' && steps.vkd3d-cache.outputs.cache-hit != 'true'
      run: python3 tools/build_vkd3d_proton.py corpus-local --work "$RUNNER_TEMP/vkd3d-work"
    - name: Run the programs
      env:
        CORPUS_LOCAL_DOWNLOADS: corpus-local
      run: python3 tools/appcorpus.py --img build/nova.img --only "$CORPUS_APP" --cache appcorpus-cache --out appcorpus-out
        --summary appcorpus-out/table.md
    - name: Show program outcome
      run: if [ -f appcorpus-out/table.md ]; then cat appcorpus-out/table.md >> "$GITHUB_STEP_SUMMARY"; else echo
        "Program did not produce a report." >> "$GITHUB_STEP_SUMMARY"; fi
      if: always()
    - name: Keep appcorpus-${{ matrix.id }}
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: appcorpus-${{ matrix.id }}
        path: appcorpus-out
        if-no-files-found: ignore
        retention-days: 14
  smp:
    name: SMP stress
    needs:
    - gate
    - build
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Install runtime dependencies
      run: tools/ci/install.sh runtime
    - name: Require working accelerator
      run: tools/ci/enable-kvm.sh required
      env:
        NOVARUN_ALLOW_TCG: ${{ inputs.allow_tcg || false }}
    - uses: actions/download-artifact@v4
      with:
        name: nova-image
        path: build
    - name: Verify tested image
      run: python3 tools/ci/image_manifest.py verify --sha "$GITHUB_SHA"
    - name: Run SMP stress
      run: |-
        mkdir -p smp-out
        python3 tools/novarun.py --img build/nova.img --smp 4 --keep smp-out --timeout 900 'smpstress scaling 0' | tee smp-out/smpstress.log
        python3 tools/ci/check-smpstress.py smp-out/smpstress.log
    - name: Keep smp-out
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smp-out
        path: smp-out/*.log
        if-no-files-found: ignore
        retention-days: 14
  corpus-result:
    name: Corpus result
    needs:
    - gate
    - build
    - app-corpus
    - smp
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
    - uses: actions/checkout@v4
    - name: Collect app reports
      if: needs.gate.outputs.run == 'true'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: appcorpus-*
        path: corpus-reports
    - name: Collect SMP log
      if: needs.gate.outputs.run == 'true'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: smp-out
        path: corpus-reports/smp-out
    - name: Validate and combine corpus reports
      run: python3 tools/ci/corpus_report.py corpus-reports
      if: always() && needs.gate.outputs.run == 'true'
      env:
        CORPUS_MATRIX: ${{ needs.gate.outputs.matrix }}
    - name: Require every selected job
      run: python3 tools/ci/results.py corpus
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      if: always()
    - name: Post nightly results to issue
      if: always() && github.event_name == 'schedule'
      run: python3 tools/ci/corpus_comment.py corpus-reports
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        CORPUS_ISSUE: '210'
        CORPUS_MATRIX: ${{ needs.gate.outputs.matrix }}
        NEEDS_JSON: ${{ toJSON(needs) }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
    - name: Publish App Store badges
      if: always() && github.event_name == 'schedule' && needs.gate.outputs.run == 'true'
      continue-on-error: true
      env:
        CORPUS_MATRIX: ${{ needs.gate.outputs.matrix }}
      run: |-
        python3 tools/ci/store_badges.py corpus-reports "$RUNNER_TEMP/store-badges.json"
        blob=$(git hash-object -w "$RUNNER_TEMP/store-badges.json")
        tree=$(printf '100644 blob %s\tstore-badges.json\n' "$blob" | git mktree)
        commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit-tree "$tree" -m "App Store badges from nightly run $GITHUB_RUN_ID at ${GITHUB_SHA::7}")
        git push --force origin "$commit:refs/heads/store-badges" || { echo "::warning::could not push the App Store badges"; exit 1; }
